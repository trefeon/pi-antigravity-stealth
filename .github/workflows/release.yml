name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun test ./tests/plugin.test.ts

      - name: Build release archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="pi-antigravity-stealth-${TAG}"
          mkdir -p "dist/${PKG_DIR}"
          cp index.ts package.json README.md LICENSE tsconfig.json "dist/${PKG_DIR}/"
          cp -r src scripts docs skills "dist/${PKG_DIR}/"
          tar -C dist -czf "dist/pi-antigravity-stealth-${TAG}.tar.gz" "${PKG_DIR}"
          (cd dist && zip -qr "pi-antigravity-stealth-${TAG}.zip" "${PKG_DIR}")
          (cd dist && sha256sum "pi-antigravity-stealth-${TAG}.tar.gz" "pi-antigravity-stealth-${TAG}.zip" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pi-antigravity-stealth-${{ github.ref_name }}.tar.gz
            dist/pi-antigravity-stealth-${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
